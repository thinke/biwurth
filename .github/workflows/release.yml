name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all history and tags, for the release notes
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${v%%-*}"
          echo "BIWURTH_VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "BIWURTH_VERSION_CODE=$(( major * 10000 + minor * 100 + ${patch:-0} ))" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BIWURTH_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BIWURTH_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release
        env:
          BIWURTH_KEYSTORE_PASSWORD: ${{ secrets.BIWURTH_KEYSTORE_PASSWORD }}
          BIWURTH_KEY_ALIAS: ${{ secrets.BIWURTH_KEY_ALIAS }}
          BIWURTH_KEY_PASSWORD: ${{ secrets.BIWURTH_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "biwurth-$BIWURTH_VERSION_NAME.apk"
          sha256sum "biwurth-$BIWURTH_VERSION_NAME.apk" > "biwurth-$BIWURTH_VERSION_NAME.apk.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: the commits since the previous tag. The app shows them as "what's new".
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## Changes"
            git log --no-merges --format='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME"
            if [ -n "$prev" ]; then echo; echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"; fi
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "biwurth-$BIWURTH_VERSION_NAME.apk" "biwurth-$BIWURTH_VERSION_NAME.apk.sha256" \
            --title "biwurth $BIWURTH_VERSION_NAME" --notes-file release-notes.md \
            $([[ "$BIWURTH_VERSION_NAME" == *-* ]] && echo --prerelease)
